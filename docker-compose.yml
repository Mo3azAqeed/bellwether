services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bellwether
      POSTGRES_PASSWORD: bellwether_dev
      POSTGRES_DB: bellwether
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once against an empty database, on first start only — schema
      # changes after that need a manual `psql -f db/schema.sql`.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellwether -d bellwether"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgres://bellwether:bellwether_dev@postgres:5432/bellwether
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
